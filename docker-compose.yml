services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cadastro_livros_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - cadastro_network
    env_file: .env
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: cadastro_livros_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cadastro_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: cadastro_livros_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cadastro_network

volumes:
  db_data:
    driver: local

networks:
  cadastro_network:
    driver: bridge
